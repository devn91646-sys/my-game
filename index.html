 
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEV SNAK ARENA</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;color:white;text-align:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#080820,#071e43,#501080);
 min-height:100vh;
}
header{padding:18px}
.logo{
 display:inline-block;font-size:45px;font-weight:1000;
 letter-spacing:9px;color:#00ffff;
 border:3px solid #00ffff;border-radius:15px;
 padding:8px 20px;text-shadow:0 0 20px #00ffff;
}
.panel{
 width:96%;max-width:1000px;margin:15px auto;padding:15px;
 background:#101a30;border:2px solid #00eaff;
 border-radius:15px;box-shadow:0 0 20px #00eaff33;
}
input,button{
 padding:12px;margin:5px;border:0;
 border-radius:8px;font-size:15px;
}
input{width:min(90%,350px);text-align:center}
button{
 background:linear-gradient(45deg,#00eaff,#00ff88);
 color:#07101c;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.4;cursor:not-allowed}
#roomID{
 color:#00ff99;font-size:34px;
 font-weight:bold;letter-spacing:7px;
}
#status{color:#ffe66d;overflow-wrap:anywhere}
.players{
 display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.player{
 background:#202b42;border-radius:10px;padding:10px;
 border:1px solid #52617b;
}
.player h3{margin:5px;font-size:17px}
.player strong{font-size:25px}
#game{
 display:block;width:100%;height:auto;max-width:900px;
 margin:15px auto;background:#10151d;
 border:3px solid #00ffff;border-radius:12px;
 touch-action:none;
}
#message{color:#ffe600;font-weight:bold}
.controls{
 display:grid;grid-template-columns:repeat(3,65px);
 justify-content:center;gap:7px;margin:15px;
}
.controls button{font-size:22px;padding:13px}
@media(max-width:600px){
 .players{grid-template-columns:repeat(2,1fr)}
 .logo{font-size:35px}
 .panel{padding:9px}
 #roomID{font-size:28px}
}
</style>
</head>

<body>

<header>
 <div class="logo">SNAK</div>
 <h1>🐍 DEV SNAK ARENA</h1>
 <p>4 PLAYER ONLINE BATTLE</p>
</header>

<div class="panel">
 <h2>🌐 MULTIPLAYER ROOM</h2>

 <p>DEV का 6 DIGIT ROOM PIN</p>
 <div id="roomID">बन रहा है...</div>

 <button onclick="copyID()">📋 COPY PIN</button>

 <hr>

 <h3>JOIN ROOM</h3>
 <input id="joinID" type="text" inputmode="numeric"
 maxlength="6" placeholder="6 Digit PIN डालें">
 <br>
 <button onclick="joinRoom()" id="joinBtn">JOIN GAME</button>

 <p id="status">Connecting to PeerJS server...</p>
</div>

<div class="panel">
 <h2>🏆 LIVE SCOREBOARD</h2>
 <div class="players" id="players"></div>

 <canvas id="game" width="800" height="600"></canvas>

 <p id="message">Waiting for players...</p>

 <button onclick="startGame()">▶ START GAME</button>
 <button onclick="resetGame()">🔄 RESTART</button>

 <h3>🎮 CONTROLS</h3>
 <div class="controls">
  <span></span>
  <button onclick="move('up')">⬆️</button>
  <span></span>
  <button onclick="move('left')">⬅️</button>
  <button onclick="move('down')">⬇️</button>
  <button onclick="move('right')">➡️</button>
 </div>
 <p>PC: Arrow Keys / WASD</p>
</div>

<footer>⚡ DEV × RAJ × MAYANK × ROHIT ⚡</footer>

<script>
const $=id=>document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d");

const SIZE=20,COLS=40,ROWS=30;
const PREFIX="dev-snak-";

const NAMES=["DEV","RAJ","MAYANK","ROHIT"];
const COLORS=["#00ff99","#ff5555","#55aaff","#ffcc44"];

const STARTS=[
 {x:5,y:5,d:"right"},
 {x:34,y:5,d:"left"},
 {x:5,y:24,d:"right"},
 {x:34,y:24,d:"left"}
];

let peer=null;
let host=false;
let mySlot=-1;
let myConn=null;
let hostPin="";

let connections={};
let players=[];
let food={x:20,y:15};

let running=false;
let timer=null;
let roomReady=false;
let joining=false;

function makePlayer(i,connected){
 let s=STARTS[i];
 let dx=s.d==="right"?1:-1;

 return {
  id:i,name:NAMES[i],color:COLORS[i],
  connected,alive:true,score:0,
  direction:s.d,nextDirection:s.d,
  snake:[
   {x:s.x,y:s.y},
   {x:s.x-dx,y:s.y},
   {x:s.x-2*dx,y:s.y}
  ]
 };
}

function resetPlayers(){
 players=STARTS.map((s,i)=>makePlayer(i,i===0));
}

function randomFood(){
 let p,attempts=0;
 do{
  p={
   x:Math.floor(Math.random()*COLS),
   y:Math.floor(Math.random()*ROWS)
  };
  attempts++;
 }while(
  players.some(pl=>pl.connected&&
   pl.snake.some(s=>s.x===p.x&&s.y===p.y))
  &&attempts<2000
 );
 return p;
}

function status(msg){
 $("status").innerText=msg;
}

function send(c,data){
 if(c&&c.open){
  c.send(data);
 }
}

function broadcast(data){
 Object.values(connections).forEach(c=>send(c,data));
}

function state(){
 return {type:"state",players,food,running};
}

function broadcastState(){
 broadcast(state());
 render();
}

// HOST PIN GENERATOR
function generatePin(){
 return String(Math.floor(100000+Math.random()*900000));
}

// HOST CREATION
function initHost(){

 host=true;
 mySlot=0;
 hostPin=generatePin();

 resetPlayers();
 food=randomFood();

 $("roomID").innerText="बन रहा है...";
 status("Creating your room...");

 peer=new Peer(PREFIX+hostPin);

 peer.on("open",()=>{
  roomReady=true;
  $("roomID").innerText=hostPin;
  status("🟢 ROOM READY! Friends को 6 digit PIN भेजें।");
  render();
 });

 peer.on("connection",c=>{
  console.log("New connection received");

  c.on("data",data=>{
   if(!data||typeof data!=="object")return;

   if(data.type==="join"){
    handleJoin(c);
    return;
   }

   let slot=c.playerSlot;
   if(slot===undefined)return;

   if(data.type==="input"){
    setDirection(slot,data.direction);
   }

   if(data.type==="start"){
    startAsHost();
   }

   if(data.type==="restart"){
    resetAsHost();
   }
  });

  c.on("close",()=>{
   let slot=c.playerSlot;
   if(slot!==undefined){
    delete connections[slot];

    if(players[slot]){
     players[slot].connected=false;
     players[slot].alive=false;
    }

    status(NAMES[slot]+" disconnected.");
    broadcastState();
   }
  });

  c.on("error",err=>{
   console.log("Connection error",err);
  });
 });

 peer.on("error",err=>{
  console.log("Host error:",err);

  if(err.type==="unavailable-id"){
   status("PIN पहले से इस्तेमाल है। नया PIN बना रहे हैं...");
   roomReady=false;
   peer.destroy();
   setTimeout(initHost,700);
   return;
  }

  status("Host error: "+err.type);
 });
}

// PLAYER JOIN HANDLER
function handleJoin(c){

 if(c.playerSlot!==undefined)return;

 let slot=players.findIndex((p,i)=>i>0&&!p.connected);

 if(slot===-1){
  send(c,{type:"full"});
  c.close();
  return;
 }

 players[slot]=makePlayer(slot,true);
 c.playerSlot=slot;
 connections[slot]=c;

 send(c,{
  type:"welcome",
  slot,
  players,
  food,
  running
 });

 status(NAMES[slot]+" joined! "+connectedCount()+"/4 players");
 broadcastState();
}

function connectedCount(){
 return players.filter(p=>p.connected).length;
}

// JOIN ROOM WITH SIX DIGIT PIN
function joinRoom(){

 if(peer){
  alert("आप पहले से किसी Room से जुड़े हैं!");
  return;
 }

 let pin=$("joinID").value.trim();

 if(!/^\d{6}$/.test(pin)){
  alert("कृपया 6 अंकों का PIN डालें!");
  return;
 }

 joining=true;
 $("joinBtn").disabled=true;
 status("Connecting to DEV's room...");

 host=false;
 peer=new Peer();

 peer.on("open",()=>{
  myConn=peer.connect(PREFIX+pin,{reliable:true});

  myConn.on("open",()=>{
   status("Connected! Requesting player slot...");
   send(myConn,{type:"join"});
  });

  myConn.on("data",data=>{
   if(!data||typeof data!=="object")return;

   if(data.type==="full"){
    status("❌ Room full! Maximum 4 players.");
    myConn.close();
    return;
   }

   if(data.type==="welcome"){
    mySlot=data.slot;
    players=data.players;
    food=data.food;
    running=data.running;

    $("message").innerText="Welcome "+NAMES[mySlot]+"!";
    status("🟢 Joined successfully as "+NAMES[mySlot]);
    $("joinBtn").disabled=true;
    render();
   }

   if(data.type==="state"){
    players=data.players;
    food=data.food;
    running=data.running;
    render();
   }
  });

  myConn.on("close",()=>{
   running=false;
   mySlot=-1;
   status("🔴 Host disconnected.");
   $("message").innerText="Room disconnected.";
   $("joinBtn").disabled=false;
   joining=false;
  });

  myConn.on("error",err=>{
   status("Connection error: "+err.type);
   $("joinBtn").disabled=false;
   joining=false;
  });
 });

 peer.on("error",err=>{
  console.log(err);
  status("Peer error: "+err.type);
  $("joinBtn").disabled=false;
  joining=false;
 });

}

// MOVEMENT
function setDirection(slot,d){

 let p=players[slot];
 if(!p||!p.alive)return;

 const opposite={
  up:"down",down:"up",
  left:"right",right:"left"
 };

 if(!opposite[d])return;

 if(opposite[d]!==p.direction){
  p.nextDirection=d;
 }
}

function move(d){

 if(mySlot===-1){
  $("message").innerText="Join a room first!";
  return;
 }

 if(host){
  setDirection(mySlot,d);
 }else{
  send(myConn,{type:"input",direction:d});
 }
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:"up",ArrowDown:"down",
  ArrowLeft:"left",ArrowRight:"right",
  w:"up",W:"up",s:"down",S:"down",
  a:"left",A:"left",d:"right",D:"right"
 };

 if(keys[e.key]){
  e.preventDefault();
  move(keys[e.key]);
 }
});

// START GAME
function startGame(){

 if(mySlot===-1){
  alert("पहले Room JOIN करें!");
  return;
 }

 if(host){
  startAsHost();
 }else{
  send(myConn,{type:"start"});
  $("message").innerText="Start request sent to DEV!";
 }
}

function startAsHost(){

 if(!host||running)return;

 if(connectedCount()<2){
  $("message").innerText="At least 2 players needed!";
  return;
 }

 running=true;
 $("message").innerText="🔥 GAME STARTED!";

 timer=setInterval(updateGame,120);
 broadcastState();
}

// RESTART
function resetGame(){

 if(mySlot===-1)return;

 if(host){
  resetAsHost();
 }else{
  send(myConn,{type:"restart"});
 }
}

function resetAsHost(){

 if(!host)return;

 clearInterval(timer);
 running=false;

 let connected=players.map(p=>p.connected);
 resetPlayers();

 for(let i=1;i<4;i++){
  if(connected[i]){
   players[i].connected=true;
  }
 }

 food=randomFood();
 $("message").innerText="Ready! Press START GAME.";
 broadcastState();
}

// HOST GAME LOOP
function updateGame(){

 if(!host||!running)return;

 let moves=[];

 players.forEach(p=>{
  if(!p.connected||!p.alive)return;

  p.direction=p.nextDirection;
  let h={...p.snake[0]};

  if(p.direction==="up")h.y--;
  if(p.direction==="down")h.y++;
  if(p.direction==="left")h.x--;
  if(p.direction==="right")h.x++;

  moves.push({p,h});
 });

 let dead=new Set();

 moves.forEach(({p,h})=>{

  if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS){
   dead.add(p.id);
   return;
  }

  if(p.snake.slice(1).some(s=>s.x===h.x&&s.y===h.y)){
   dead.add(p.id);
  }

  players.forEach(other=>{
   if(other===p||!other.connected||!other.alive)return;

   if(other.snake.some(s=>s.x===h.x&&s.y===h.y)){
    dead.add(p.id);
   }
  });
 });

 let ate=false;

 moves.forEach(({p,h})=>{

  if(dead.has(p.id)){
   p.alive=false;
   return;
  }

  p.snake.unshift(h);

  if(!ate&&h.x===food.x&&h.y===food.y){
   p.score+=10;
   ate=true;
  }else{
   p.snake.pop();
  }
 });

 if(ate)food=randomFood();

 let alive=players.filter(p=>p.connected&&p.alive);

 if(alive.length<=1){
  running=false;
  clearInterval(timer);

  $("message").innerText=alive.length?
   "🏆 WINNER: "+alive[0].name:"GAME OVER!";
 }

 broadcastState();
}

// DISPLAY
function render(){

 draw();

 let box=$("players");
 box.innerHTML="";

 NAMES.forEach((name,i)=>{

  let p=players[i];
  let connected=p&&p.connected;
  let alive=connected&&p.alive;

  let div=document.createElement("div");
  div.className="player";

  let h=document.createElement("h3");
  h.style.color=COLORS[i];
  h.innerText=name;

  let score=document.createElement("strong");
  score.innerText=p?p.score:0;

  let label=document.createElement("p");
  label.innerText=!connected?"WAITING":!alive?"OUT":"PLAYING";

  div.append(h,score,label);
  box.appendChild(div);
 });
}

function draw(){

 ctx.clearRect(0,0,800,600);

 for(let y=0;y<ROWS;y++){
  for(let x=0;x<COLS;x++){
   ctx.fillStyle=(x+y)%2===0?"#182333":"#202b3b";
   ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);
  }
 }

 ctx.fillStyle="#ff3030";
 ctx.shadowColor="#ff0000";
 ctx.shadowBlur=18;

 ctx.beginPath();
 ctx.arc(food.x*SIZE+10,food.y*SIZE+10,8,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;

 players.forEach(p=>{
  if(!p||!p.connected)return;

  p.snake.forEach((s,i)=>{
   ctx.fillStyle=i===0?"white":p.color;
   ctx.fillRect(s.x*SIZE+1,s.y*SIZE+1,18,18);
  });

  if(p.snake.length){
   ctx.font="bold 12px Arial";
   ctx.fillStyle=p.color;
   ctx.fillText(p.name,p.snake[0].x*SIZE,p.snake[0].y*SIZE-5);
  }
 });
}

// COPY PIN
async function copyID(){

 let id=hostPin;

 if(!roomReady||!id){
  alert("Room PIN बनने का इंतजार करें!");
  return;
 }

 try{
  await navigator.clipboard.writeText(id);
  alert("6 Digit PIN Copied: "+id);
 }catch(e){
  prompt("Copy your Room PIN:",id);
 }
}

// INITIALIZE
resetPlayers();
food=randomFood();
render();
initHost();

</script>
</body>
</html>
